config-version = 2

# Start AeroSpace when logging in
start-at-login = true

# Automatically reload config after saving
auto-reload-config = true

# Keep tree structure sane
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Accordion layout spacing
accordion-padding = 30

# Don't unexpectedly move the mouse when switching monitors
on-focused-monitor-changed = []

# I don't recommend focus-follows-mouse for laptop use
focus-follows-mouse.enabled = true

# Explicit persistent workspaces
persistent-workspaces = []

# Small gaps
[gaps]
inner.horizontal = 8
inner.vertical = 8

outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8


# ============================================================
# Main mode
# ============================================================

[mode.main.binding]

# ------------------------------------------------------------
# Launch
# ------------------------------------------------------------

# Open a NEW Ghostty window
alt-enter = '''exec-and-forget osascript -e '
tell application "Ghostty"
    new window
end tell'
'''


# ------------------------------------------------------------
# Close
# ------------------------------------------------------------

alt-backspace = 'close'

# ------------------------------------------------------------
# Focus
# ------------------------------------------------------------

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# ------------------------------------------------------------
# Move windows
# ------------------------------------------------------------

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# ------------------------------------------------------------
# Layout
# ------------------------------------------------------------

# Toggle horizontal / vertical tiling direction
alt-slash = 'layout tiles horizontal vertical'

# Toggle accordion layout
alt-comma = 'layout accordion horizontal vertical'

# Toggle floating / tiling
alt-space = 'layout floating tiling'

# Fullscreen
alt-f = 'fullscreen'

# ------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-d = 'workspace --auto-back-and-forth D'

# Move current window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-d = 'move-node-to-workspace D'

alt-leftSquareBracket = 'list-workspaces --monitor focused --empty no | workspace --stdin --wrap-around prev'
alt-rightSquareBracket = 'list-workspaces --monitor focused --empty no | workspace --stdin --wrap-around next'

# Move current window to previous / next normal workspace
alt-shift-leftSquareBracket = 'list-workspaces --monitor focused --empty no | move-node-to-workspace --stdin --wrap-around prev'
alt-shift-rightSquareBracket = 'list-workspaces --monitor focused --empty no | move-node-to-workspace --stdin --wrap-around next'

# Jump back to previous workspace
alt-tab = 'workspace-back-and-forth'

# Move workspace to next monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# ------------------------------------------------------------
# Resize
# ------------------------------------------------------------

alt-r = 'mode resize'

# ------------------------------------------------------------
# Maintenance
# ------------------------------------------------------------

alt-shift-r = 'reload-config'


# ============================================================
# Resize mode
# ============================================================

[mode.resize.binding]

h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'

minus = 'resize smart -50'
equal = 'resize smart +50'

enter = 'mode main'
esc = 'mode main'


# ============================================================
# Special Workspaces
# ============================================================

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.tencent.xinWeChat'
run = 'move-node-to-workspace D'
