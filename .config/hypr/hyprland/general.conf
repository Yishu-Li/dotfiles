general {
    layout = dwindle

    allow_tearing = false  # Allows `immediate` window rule to work

    gaps_workspaces = $workspaceGaps
    gaps_in = $windowGapsIn
    gaps_out = $windowGapsOut
    border_size = $windowBorderSize

    col.active_border = $activeWindowBorderColour
    col.inactive_border = $inactiveWindowBorderColour
}

dwindle {
        preserve_split = true
        smart_split = false
        smart_resizing = true
}

scrolling {
    column_width = 0.5            # Default width of a column (0.1 - 1.0)
    direction = right             # Direction windows open (right/left/up/down)
    fullscreen_on_one_column = true # Single column spans entire screen
    focus_fit_method = 1          # 0 = center, 1 = fit
}
